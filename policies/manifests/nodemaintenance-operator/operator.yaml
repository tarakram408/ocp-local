# Node Maintenance Operator (Red Hat Workload Availability): puts a node into maintenance with a NodeMaintenance CR
# (cordon + drain; running VMs live-migrate off the node first) and takes it out again when the CR is deleted.
# Only the operator is in git. NodeMaintenance CRs are created per maintenance window (runbook / console:
# Compute → Nodes → ⋮ → Start Maintenance) and deleted afterwards, so they are deliberately NOT managed here.
# Before the first push, confirm the channel on a cluster:
#   oc get packagemanifest node-maintenance-operator -n openshift-marketplace -o jsonpath='{.status.defaultChannel}{"\n"}'
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-workload-availability
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: workload-availability-operator-group
  namespace: openshift-workload-availability
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: node-maintenance-operator
  namespace: openshift-workload-availability
spec:
  channel: stable
  name: node-maintenance-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
