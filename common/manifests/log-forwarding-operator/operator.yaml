# Switch 20 (log-forwarding): Red Hat OpenShift Logging operator, used only as a forwarder (no LokiStack, nothing
# stored on the cluster). No channel: OLM uses the package's default channel for this OpenShift version.
# Check: oc get csv -n openshift-logging | grep cluster-logging
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-logging
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cluster-logging
  namespace: openshift-logging
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-logging
  namespace: openshift-logging
spec:
  name: cluster-logging
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
