# Alertmanager configuration shared by every cluster. The common-alerting policy fills in the
# __PLACEHOLDERS__ from common-values (SMTP, recipient) and <cluster>-site-values (cluster name, sender),
# then writes the result to the alertmanager-main secret in openshift-monitoring.
# Changes made in the console (Administration > Alerting) are overwritten: change this file instead.
global:
  resolve_timeout: 5m
  smtp_smarthost: '__SMARTHOST__'
  smtp_from: '__FROM__'
  smtp_hello: '__HELLO__'
  smtp_require_tls: __REQUIRE_TLS__
__AUTH__
inhibit_rules:
  - equal: [namespace, alertname]
    source_matchers: ['severity = critical']
    target_matchers: ['severity =~ warning|info']
  - equal: [namespace, alertname]
    source_matchers: ['severity = warning']
    target_matchers: ['severity = info']
  - equal: [namespace]
    source_matchers: ['alertname = InfoInhibitor']
    target_matchers: ['severity = info']
route:
  receiver: default
  group_by: [namespace, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Always firing by design (proves the alert pipeline works); never emailed
    - matchers: ['alertname =~ Watchdog|InfoInhibitor']
      receiver: default
    # Only critical alerts are e-mailed. Warning and info alerts stay visible in the console and in ACM.
    # To e-mail warnings as well, add:  - matchers: ['severity = warning']  /  receiver: email
    - matchers: ['severity = critical']
      receiver: email
      repeat_interval: 4h
receivers:
  - name: default
  - name: email
    email_configs:
      - to: '__TO__'
        send_resolved: true
        headers:
          Subject: '[__CLUSTER__] {{ .Status | toUpper }} {{ .CommonLabels.severity }}: {{ .CommonLabels.alertname }} ({{ .Alerts | len }})'
