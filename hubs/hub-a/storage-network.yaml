# hub-a storage network: applied by hand in README Phase 1 step 2 (before Trident), then owned by hub-config.
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: storage-network
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  desiredState:
    interfaces:
      - name: bond1
        type: bond
        state: up
        mtu: 1500
        ipv4: { enabled: false }
        ipv6: { enabled: false }
        link-aggregation:
          mode: active-backup
          options: { miimon: "100" }
          port: [ens5f6, ens5f7]             # hub-a01: ens5f6 = 02:00:00:00:00:03, ens5f7 = 02:00:00:00:00:04 (INFRA_vmstor A/B; 8-vNIC OpenShift UCS layout)
      - name: bond1.222                        # NFS VLAN 222 (in use on hub-a)
        type: vlan
        state: up
        mtu: 1500
        vlan: { base-iface: bond1, id: 222 }
        ipv4:
          enabled: true
          dhcp: false
          address: [{ ip: 10.60.140.50, prefix-length: 24 }]   # hub-a01-stor (host sheet)
        ipv6: { enabled: false }
