apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One line per cluster. Both production clusters are installed through the Assisted Installer on console.redhat.com
# and imported from git (clusters/<cluster>/managedcluster.yaml + a hand-made auto-import-secret).
# Commenting a line out stages a detach: prune is off, so nothing happens until someone syncs with prune.
# With no cluster enabled, use "resources: []": a bare "resources:" with every line commented out fails the build
# ("kustomization.yaml is empty") and Argo CD stops syncing the clusters app.
resources:
  - ocp-b
  - ocp-a     # adopted into GitOps 12 Nov (docs/ocp-a-gitops.md, Option B): every production policy enforces on it
