# 12: RHACM MultiClusterObservability on a hub (hubs only). The operator ships with RHACM and the namespace
# is created on every hub by hub/kustomization.yaml; this is the configuration, which needs storage.
# Switch on with "observability: enabled" in hubs/<hub>/local-cluster-labels.yaml once, on that hub:
#   - the S3 bucket exists (acm-metrics-hub-a on hub-a, acm-metrics-hub-b on hub-b; ONTAP S3 on SVM_OCP_A,
#     s3-site-a.example.com = storage LIFs .151/.152, reached by pods through feature 16 routing-via-host)
#   - the secrets thanos-object-storage, thanos-s3-ca and multiclusterhub-operator-pull-secret exist in
#     open-cluster-management-observability (hub/observability/thanos-object-storage.yaml.example)
#   - the default StorageClass ontap-nas exists (Trident on the hub)
# hub-a collects from local-cluster, ocp-a and ocp-b; hub-b, while standby, only from itself.
apiVersion: observability.open-cluster-management.io/v1beta2
kind: MultiClusterObservability
metadata:
  name: observability
spec:
  observabilityAddonSpec:
    enableMetrics: true
    interval: 300                    # seconds between metric collections on each cluster
  advanced:
    retentionConfig:
      retentionResolutionRaw: 30d    # full resolution, for troubleshooting
      retentionResolution5m: 180d
      retentionResolution1h: 365d    # trends and capacity planning
  storageConfig:
    storageClass: ontap-nas
    receiveStorageSize: 50Gi         # hub volumes on ontap-nas (thin); defaults are larger
    compactStorageSize: 50Gi
    storeStorageSize: 10Gi
    ruleStorageSize: 1Gi
    alertmanagerStorageSize: 1Gi
    metricObjectStorage:
      name: thanos-object-storage
      key: thanos.yaml
      tlsSecretName: thanos-s3-ca    # root CA of the ONTAP S3 server (SVM_OCP_A: system-generated certificate)
      tlsSecretMountPath: /etc/minio/certs
