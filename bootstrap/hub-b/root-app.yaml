# hub-b (standby hub) only. The only Application applied by hand; it creates what is listed in argocd-apps-hub-b/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: openshift-gitops
  labels:
    velero.io/exclude-from-backup: "true"       # each hub\'s apps come from its own folder; never restored onto the other hub
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGEME/ocp-local.git
    targetRevision: main
    path: argocd-apps-hub-b
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
