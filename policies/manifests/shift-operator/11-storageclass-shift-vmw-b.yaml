# Shift annotations on the Bravo StorageClass (created by the shift-backends policy, vmw-b.yaml), same as
# 10-storageclass-shift.yaml for Charlie: PVCs that MTV creates on it are handed to the Shift listener.
# musthave: only these annotations are added.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontap-nas-vmw-b
  annotations:
    shift.netapp.io/storage-class-type: shift
    shift.netapp.io/trident-backend-uuid: '{{ (lookup "trident.netapp.io/v1" "TridentBackendConfig" "trident" "ontap-nas-vmw-b").status.backendInfo.backendUUID }}'
