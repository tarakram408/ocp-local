# Runs on the hub. For every namespace labelled cluster-install/copy-secrets=true it creates the two
# secrets a ClusterInstance needs, copied from the cluster-install-secrets namespace:
#   assisted-deployment-pull-secret   <- pull-secret
#   <cluster>-bmc-secret              <- bmc-credentials-<cluster> if it exists, else bmc-credentials
# These are managed-cluster templates (no "hub" keyword) on purpose: they are resolved by the policy
# controller on the hub itself, which may read any namespace. Hub templates may not.
object-templates-raw: |
  {{- range (lookup "v1" "Namespace" "" "" "cluster-install/copy-secrets=true").items }}
  {{- $cluster := .metadata.name }}
  {{- $bmc := "bmc-credentials" }}
  {{- $override := printf "bmc-credentials-%s" $cluster }}
  {{- if (lookup "v1" "Secret" "cluster-install-secrets" $override).metadata }}
  {{- $bmc = $override }}
  {{- end }}
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: assisted-deployment-pull-secret
        namespace: {{ $cluster }}
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ fromSecret "cluster-install-secrets" "pull-secret" ".dockerconfigjson" }}'
  - complianceType: musthave
    objectDefinition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ $cluster }}-bmc-secret
        namespace: {{ $cluster }}
      type: Opaque
      data:
        username: '{{ fromSecret "cluster-install-secrets" $bmc "username" }}'
        password: '{{ fromSecret "cluster-install-secrets" $bmc "password" }}'
  {{- end }}
