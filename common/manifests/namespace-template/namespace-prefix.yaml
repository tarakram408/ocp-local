# Namespaces created by people must start with the prefix in common-values (namespacePrefix).
# Operators, Argo CD and policies (system:* users) and the break-glass group are exempt, so platform
# namespaces (openshift-*, trident, vm-workloads from git, ...) are not affected.
# Ships in Warn+Audit like gitops-guardrails; change the binding to [Deny] once confirmed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: namespace-prefix
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
  validations:
    - expression: >-
        request.userInfo.username.startsWith('system:') ||
        ('break-glass' in request.userInfo.groups) ||
        object.metadata.name.startsWith('{{hub fromConfigMap "policies" "common-values" "namespacePrefix" hub}}')
      message: 'Namespace names must start with {{hub fromConfigMap "policies" "common-values" "namespacePrefix" hub}}'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: namespace-prefix
spec:
  policyName: namespace-prefix
  validationActions: [Warn, Audit]
