# hub-b: the shared hub configuration in hub/ plus what is specific to this hub.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../hub
  - storage-network.yaml
  - site-values.yaml
  - local-cluster-labels.yaml
  - restore.yaml             # passive restore of hub-a backups; Argo CD resources excluded (hub/backup/README.md)
