# Corp RHEL 9 template (small), from rhel9-server-small. Differences from the Red Hat template:
#   - root disk named <vm>-disk-0 (same convention as MTV plans, switch 19) instead of <vm>
#   - cdi.kubevirt.io/storage.usePopulator "false": the PVC is created directly, so Trident names the ONTAP volume
#     <cluster>_<namespace>_<vm>_disk_0_<suffix> instead of prime_<uuid> (tested 19 Nov: test-vm -> ocp_a_virtual_machines_test_vm_disk_0_ceed)
#   - SSP operator labels/annotations removed, so the operator leaves this copy alone on upgrades
# Extra disks added from the console still get prime_ names: use scripts/add-vm-disk.sh (docs/vm-disk-naming.md).
#   - Corp tag keys on the VM (labels/annotations example.com/*, empty until filled in the wizard, docs/vm-tagging.md); OS fixed to Linux.
kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: corp-rhel9-server-small
  namespace: openshift
  labels:
    template.kubevirt.io/architecture: amd64
    flavor.template.kubevirt.io/small: 'true'
    template.kubevirt.io/version: v0.35.0
    template.kubevirt.io/type: vm
    vm.kubevirt.io/template: rhel9-server-small
    os.template.kubevirt.io/rhel9.0: 'true'
    os.template.kubevirt.io/rhel9.1: 'true'
    os.template.kubevirt.io/rhel9.2: 'true'
    os.template.kubevirt.io/rhel9.3: 'true'
    os.template.kubevirt.io/rhel9.4: 'true'
    vm.kubevirt.io/template.namespace: openshift
    os.template.kubevirt.io/rhel9.5: 'true'
    os.template.kubevirt.io/rhel9.6: 'true'
    workload.template.kubevirt.io/server: 'true'
    os.template.kubevirt.io/rhel9.7: 'true'
    os.template.kubevirt.io/rhel9.8: 'true'
  annotations:
    template.kubevirt.io/provider: ''
    template.kubevirt.io/provider-url: 'https://www.redhat.com'
    template.kubevirt.io/containerdisks: |
      registry.redhat.io/rhel9/rhel-guest-image
    template.kubevirt.io/version: v1alpha1
    openshift.io/display-name: Corp RHEL 9 VM (small)
    openshift.io/documentation-url: 'https://github.com/kubevirt/common-templates'
    template.kubevirt.io/images: |
      https://access.redhat.com/downloads/content/479/ver=/rhel---9/9.0/x86_64/product-software
    defaults.template.kubevirt.io/disk: rootdisk
    name.os.template.kubevirt.io/rhel9.0: Red Hat Enterprise Linux 9.0 or higher
    name.os.template.kubevirt.io/rhel9.1: Red Hat Enterprise Linux 9.0 or higher
    template.kubevirt.io/editable: |
      /objects[0].spec.template.spec.domain.cpu.sockets
      /objects[0].spec.template.spec.domain.cpu.cores
      /objects[0].spec.template.spec.domain.cpu.threads
      /objects[0].spec.template.spec.domain.memory.guest
      /objects[0].spec.template.spec.domain.devices.disks
      /objects[0].spec.template.spec.volumes
      /objects[0].spec.template.spec.networks
    name.os.template.kubevirt.io/rhel9.2: Red Hat Enterprise Linux 9.0 or higher
    template.openshift.io/bindable: 'false'
    openshift.kubevirt.io/pronounceable-suffix-for-name-expression: 'true'
    name.os.template.kubevirt.io/rhel9.3: Red Hat Enterprise Linux 9.0 or higher
    name.os.template.kubevirt.io/rhel9.4: Red Hat Enterprise Linux 9.0 or higher
    tags: 'hidden,kubevirt,virtualmachine,linux,rhel'
    name.os.template.kubevirt.io/rhel9.5: Red Hat Enterprise Linux 9.0 or higher
    name.os.template.kubevirt.io/rhel9.6: Red Hat Enterprise Linux 9.0 or higher
    template.kubevirt.io/provider-support-level: Full
    name.os.template.kubevirt.io/rhel9.7: Red Hat Enterprise Linux 9.0 or higher
    name.os.template.kubevirt.io/rhel9.8: Red Hat Enterprise Linux 9.0 or higher
    description: Template for Red Hat Enterprise Linux 9 VM or newer. A PVC with the RHEL disk image must be available.
    openshift.io/support-url: 'https://github.com/kubevirt/common-templates/issues'
    iconClass: icon-rhel
    openshift.io/provider-display-name: ''
objects:
  - apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    metadata:
      annotations:
        vm.kubevirt.io/validations: |
          [
            {
              "name": "minimal-required-memory",
              "path": "jsonpath::.spec.domain.memory.guest",
              "rule": "integer",
              "message": "This VM requires more memory.",
              "min": 1610612736
            }
          ]
        example.com/application: '${APPLICATION}'
        example.com/charging-account: '${CHARGING_ACCOUNT}'
        example.com/created-by: '${CREATED_BY}'
        example.com/owner-department: '${OWNER_DEPARTMENT}'
        example.com/owner-department-contact: '${OWNER_DEPARTMENT_CONTACT}'
        example.com/support-department: '${SUPPORT_DEPARTMENT}'
        example.com/support-department-contact: '${SUPPORT_DEPARTMENT_CONTACT}'
      labels:
        app: '${NAME}'
        kubevirt.io/dynamic-credentials-support: 'true'
        vm.kubevirt.io/template: corp-rhel9-server-small
        vm.kubevirt.io/template.revision: '1'
        vm.kubevirt.io/template.namespace: openshift
        example.com/environment: '${ENVIRONMENT}'
        example.com/support-level: '${SUPPORT_LEVEL}'
        example.com/dr-tier: '${DR_TIER}'
        example.com/os: Linux
      name: '${NAME}'
    spec:
      dataVolumeTemplates:
        - apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: '${NAME}-disk-0'
            annotations:
              cdi.kubevirt.io/storage.usePopulator: 'false'   # PVC created directly: ONTAP <cluster>_<ns>_<vm>_disk_0, not prime_<uuid>
          spec:
            sourceRef:
              kind: DataSource
              name: '${DATA_SOURCE_NAME}'
              namespace: '${DATA_SOURCE_NAMESPACE}'
            storage:
              resources:
                requests:
                  storage: 30Gi
      runStrategy: Halted
      template:
        metadata:
          annotations:
            vm.kubevirt.io/flavor: small
            vm.kubevirt.io/os: rhel9
            vm.kubevirt.io/workload: server
          labels:
            kubevirt.io/domain: '${NAME}'
            kubevirt.io/size: small
        spec:
          architecture: amd64
          domain:
            cpu:
              cores: 1
              sockets: 1
              threads: 1
            devices:
              disks:
                - disk:
                    bus: virtio
                  name: rootdisk
                - disk:
                    bus: virtio
                  name: cloudinitdisk
              interfaces:
                - masquerade: {}
                  model: virtio
                  name: default
              rng: {}
            features:
              smm:
                enabled: true
            firmware:
              bootloader:
                efi: {}
            memory:
              guest: 2Gi
          networks:
            - name: default
              pod: {}
          terminationGracePeriodSeconds: 180
          volumes:
            - dataVolume:
                name: '${NAME}-disk-0'
              name: rootdisk
            - cloudInitNoCloud:
                userData: |-
                  #cloud-config
                  user: cloud-user
                  password: ${CLOUD_USER_PASSWORD}
                  chpasswd: { expire: False }
              name: cloudinitdisk
parameters:
  - name: NAME
    description: VM name
    generate: expression
    from: 'rhel9-[a-z0-9]{16}'
  - name: DATA_SOURCE_NAME
    description: Name of the DataSource to clone
    value: rhel9
  - name: DATA_SOURCE_NAMESPACE
    description: Namespace of the DataSource
    value: openshift-virtualization-os-images
  - name: CLOUD_USER_PASSWORD
    description: Randomized password for the cloud-init user cloud-user
    generate: expression
    from: '[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}'
  # Corp tags (docs/vm-tagging.md). Empty by default, NOT 'required: true': the 4.22 Create VirtualMachine
  # wizard cannot process a template with required parameters that have no value (it hangs at Customization). The keys are
  # created empty; fill them on the Customization step (Metadata: labels and annotations) or the YAML tab. Left empty, the
  # admission policy vm-tags warns (or refuses, per cluster) and vm-tagging-report lists the VM.
  - name: ENVIRONMENT
    displayName: Environment
    description: 'sbx, dev, tst or prd'
    value: ''
  - name: SUPPORT_LEVEL
    displayName: Support level
    description: '24x7, 9x5 or Unmanaged'
    value: ''
  - name: DR_TIER
    displayName: DR tier
    description: '1, 2 or 3'
    value: ''
  - name: APPLICATION
    displayName: Application
    description: Application the VM serves
    value: ''
  - name: CHARGING_ACCOUNT
    displayName: Charging account
    description: 'Charging account string, e.g. CO01...XX000000.CC0001.PG00001.PJ000001...'
    value: ''
  - name: CREATED_BY
    displayName: Created by
    description: NetID of the person creating the VM
    value: ''
  - name: OWNER_DEPARTMENT
    displayName: Owner department
    value: ''
  - name: OWNER_DEPARTMENT_CONTACT
    displayName: Owner department contact
    description: E-mail address
    value: ''
  - name: SUPPORT_DEPARTMENT
    displayName: Support department
    value: ''
  - name: SUPPORT_DEPARTMENT_CONTACT
    displayName: Support department contact
    description: E-mail address
    value: ''
