# Per-hub values for the common/ policies. On each hub the hub manages itself as "local-cluster", so the
# policies look up "local-cluster-site-values"; this file is applied only to hub-b by its hub-config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-cluster-site-values
  namespace: policies
data:
  consoleProductName: "Corp HUB-B"                # browser tab title (common console policy)
  bannerText: "ACM HUB - hub-b (standby hub) - changes are made through git only"
  bannerColor: "#ffffff"
  bannerBackground: "#00407a"
  metallbAddresses: "172.28.55.CHANGEME-172.28.55.CHANGEME"   # CHANGEME: only if MetalLB is enabled on this hub
  alertClusterName: "hub-b"                         # shown in the alert e-mail subject
  alertEmailFrom: "openshift-hub-alert@example.com"          # CHANGEME if the mail team assigns a different sender
