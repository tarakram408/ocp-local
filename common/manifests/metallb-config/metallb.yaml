# MetalLB in layer 2 mode: LoadBalancer services get an address from this cluster's range
# (metallbAddresses in <cluster>-site-values), announced on the management network.
# Removed again when config.example.com/metallb is switched off (pruneObjectBehavior).
apiVersion: metallb.io/v1beta1
kind: MetalLB
metadata:
  name: metallb
  namespace: metallb-system
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb-system
spec:
  addresses:
    - '{{hub fromConfigMap "policies" (printf "%s-site-values" .ManagedClusterName) "metallbAddresses" hub}}'
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools: [default]
  # interfaces: [bond0.24]        # optional: announce only on the management VLAN interface
