# The NetApp Shift Toolkit drives the migration through the OpenShift API and its documentation
# asks for a service account token with cluster-admin. This is a standing cluster-admin credential:
# hand the token over a secure channel, and delete the "shift-toolkit-access" policy entry when the
# migration is finished, which removes all three objects.
#   oc -n openshift-mtv get secret shift-toolkit-token -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shift-toolkit
  namespace: openshift-mtv
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shift-toolkit-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: shift-toolkit
    namespace: openshift-mtv
---
apiVersion: v1
kind: Secret
metadata:
  name: shift-toolkit-token
  namespace: openshift-mtv
  annotations:
    kubernetes.io/service-account.name: shift-toolkit
type: kubernetes.io/service-account-token
