# NetApp Data Infrastructure Insights (DII) - Red Hat OpenShift Virtualization data collector.
# DII discovers the OpenShift Virtualization VMs (not all pods) over the cluster API on 6443 with a read-only service
# account token. NetApp's setup (docs.netapp.com/us-en/data-infrastructure-insights/task_dc_redhat_openshift_virtualization.html):
#   1. service account acq-readonly-cluster-user in namespace default
#   2. cluster-reader            -> rolebinding name acq-readonly-cluster-user-binding
#   3. cluster-monitoring-view   -> rolebinding name acq-readonly-cluster-monitor-user-binding
#   4. oc create token acq-readonly-cluster-user --duration=8760h
#   5. oc cluster-info           -> the API endpoint entered in the DII collector
# Steps 1-3 are this file (ClusterRoleBindings with NetApp's names). Step 4 is NOT in git: the token is a secret,
# created by hand per cluster and pasted into DII; it expires after a year and DII then fails with "Failed to connect"
# (runbook: renew it before then). One DII collector per cluster, as NetApp recommends.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acq-readonly-cluster-user
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: acq-readonly-cluster-user-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
  - kind: ServiceAccount
    name: acq-readonly-cluster-user
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: acq-readonly-cluster-monitor-user-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: acq-readonly-cluster-user
    namespace: default
