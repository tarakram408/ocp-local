# Shift admin login (used by the Shift server and the listener). Copied from the hub secret
# policies/shift-credentials-<cluster> (keys username, password), never in git. Create it once on the hub:
#   read -p "Shift admin user [admin]: " U; U=${U:-admin}; read -s -p "Password: " P; echo
#   oc -n policies create secret generic shift-credentials-ocp-a --from-literal=username="$U" --from-literal=password="$P"; unset P
#   oc -n policies label secret shift-credentials-ocp-a cluster.open-cluster-management.io/backup=""
# Or from the secret already on ocp-a:
#   oc -n policies create secret generic shift-credentials-ocp-a \
#     --from-literal=username="$(oc --kubeconfig ~/ocp-a.kubeconfig get secret shift-credentials -n shift -o jsonpath='{.data.username}' | base64 -d)" \
#     --from-literal=password="$(oc --kubeconfig ~/ocp-a.kubeconfig get secret shift-credentials -n shift -o jsonpath='{.data.password}' | base64 -d)"
apiVersion: v1
kind: Secret
metadata:
  name: shift-credentials
  namespace: shift
type: Opaque
data:
  username: '{{hub fromSecret "policies" (printf "shift-credentials-%s" .ManagedClusterName) "username" hub}}'
  password: '{{hub fromSecret "policies" (printf "shift-credentials-%s" .ManagedClusterName) "password" hub}}'
